# Stratum core. App backends live with their apps (apps/<id>/compose.yml) and
# are plugged in by compose.apps.yml, which ./setup.sh writes; .env sets
# COMPOSE_FILE so `docker compose up -d --build` runs both.
services:
  stratum:
    build: .
    image: stratum:latest
    container_name: stratum
    restart: unless-stopped
    # Run as the host user so ./data (db, cert) stays editable outside Docker.
    user: "${STRATUM_UID:-1000}:${STRATUM_GID:-1000}"
    ports:
      - "${STRATUM_PORT:-8930}:8930"
    # STRATUM_APP_SECRET_<ID> for each app backend (generated by ./setup.sh).
    env_file:
      - path: app-secrets.env
        required: false
    volumes:
      - ./data:/app/data
      # Live code: client edits show up on reload (server sends no-cache);
      # server edits need `docker compose restart`. The image also bakes a
      # copy, so removing these lines gives a frozen, self-contained build.
      - ./client:/app/client:ro
      - ./server:/app/server:ro
      - ./apps:/app/apps:ro
